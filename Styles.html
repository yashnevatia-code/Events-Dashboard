<style>
/* ==========================================================================
   RECYKAL — DRS EVENT INTELLIGENCE  |  Styles
   All brand colours live in CSS variables so they can be re-skinned easily.
   ========================================================================== */
:root {
  --primary: #00573F;
  --primary-light: #D9E8E2;
  --primary-dark: #003D2C;
  --background: #F6F8F7;
  --surface: #FFFFFF;
  --text-primary: #16201C;
  --text-secondary: #68746F;
  --border: #E3E8E5;
  --danger: #C53D3D;
  --warning: #D79C27;
  --info: #3E6E92;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,32,28,.04), 0 4px 16px rgba(16,32,28,.06);
  --shadow-lg: 0 8px 32px rgba(16,32,28,.14);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--background);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 24px;
  padding: 12px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand-mark { font-weight: 800; letter-spacing: .5px; color: var(--primary); font-size: 18px; }
.brand-sub { font-size: 11px; color: var(--text-secondary); letter-spacing: .4px; text-transform: uppercase; }

.mainnav { display: flex; gap: 6px; }
.nav-btn {
  border: none; background: transparent; cursor: pointer;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  transition: background .15s, color .15s;
}
.nav-btn:hover { background: var(--background); color: var(--text-primary); }
.nav-btn.active { background: var(--primary-light); color: var(--primary-dark); }

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.sync-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
.btn-ghost:hover { background: var(--background); }
.btn.is-busy .refresh-ico { animation: spin .8s linear infinite; }
.ico { font-size: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Page head ---------- */
.pagehead {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
  padding: 24px 28px 8px;
}
.pagehead h1 { margin: 0; font-size: 22px; letter-spacing: .4px; }
.subtitle { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
.banner {
  padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  background: #FCEEEE; color: var(--danger); border: 1px solid #F3D4D4;
}

/* ---------- Views ---------- */
.view { display: none; padding: 8px 28px 40px; }
.view.active { display: block; }

/* ---------- KPI cards ---------- */
.kpi-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px; margin: 16px 0 20px;
}
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.kpi .kpi-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .4px; }
.kpi .kpi-value { font-size: 30px; font-weight: 700; margin-top: 6px; color: var(--primary-dark); }
.kpi .kpi-note { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

/* ---------- Cards / blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.block { margin: 26px 0 0; }
.block-title { font-size: 16px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.count-badge { font-size: 12px; font-weight: 600; color: var(--text-secondary); background: var(--background); padding: 2px 10px; border-radius: 20px; }
.derived-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
  color: var(--info); background: #EAF1F6; padding: 2px 8px; border-radius: 6px; }

/* ---------- Filters ---------- */
.filter-bar { padding: 16px 18px; margin-bottom: 4px; display: flex; align-items: flex-end; gap: 16px; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; flex: 1; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.fld input, .fld select {
  font-family: var(--font); font-size: 13px; color: var(--text-primary);
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); width: 100%;
}
.fld input:focus, .fld select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.btn-reset { align-self: flex-end; }

/* ---------- Upcoming ---------- */
.upcoming-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.upcoming-card {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer;
  transition: box-shadow .15s, transform .1s;
}
.upcoming-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.upcoming-card .uc-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.upcoming-card .uc-meta { font-size: 12px; color: var(--text-secondary); margin: 2px 0; }
.uc-countdown { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
  color: var(--primary-dark); background: var(--primary-light); padding: 3px 9px; border-radius: 20px; }
.uc-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }

/* ---------- Charts ---------- */
.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 22px; }
.chart-card { padding: 16px 18px; }
.chart-card.wide { grid-column: 1 / -1; }
.chart-card h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap.tall { height: 380px; }

/* ---------- Tables ---------- */
.table-card { padding: 0; overflow: hidden; }
.table-scroll { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); }
.data-table th { background: var(--background); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-secondary); position: sticky; top: 0; }
.data-table th.num, .data-table td.num { text-align: right; }
.data-table tbody tr { cursor: pointer; transition: background .12s; }
.data-table tbody tr:hover { background: var(--primary-light); }
.data-table td.evt { font-weight: 600; max-width: 260px; }
.dup-flag { font-size: 10px; color: var(--warning); margin-left: 6px; border: 1px solid var(--warning); border-radius: 4px; padding: 0 4px; }

/* Pills */
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
.pill-p1 { background: #FCEEEE; color: var(--danger); }
.pill-p2 { background: #FBF2E0; color: var(--warning); }
.pill-p3 { background: #EAF1F6; color: var(--info); }
.pill-un { background: var(--background); color: var(--text-secondary); }
.pill-use { background: var(--primary-light); color: var(--primary-dark); }
.pill-neutral { background: var(--background); color: var(--text-secondary); }

.empty-state { padding: 40px 20px; text-align: center; color: var(--text-secondary); font-size: 14px; }

/* ---------- Detail drawer ---------- */
.drawer-overlay { position: fixed; inset: 0; background: rgba(16,32,28,.35); z-index: 50; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 480px; max-width: 92vw;
  background: var(--surface); box-shadow: var(--shadow-lg); z-index: 60;
  display: flex; flex-direction: column; animation: slideIn .2s ease;
}
/* The `display:flex/fixed` rules above out-specify the browser's default
   [hidden]{display:none}, so the hidden attribute alone can't hide the drawer.
   These guards restore that: when hidden, the drawer/overlay render nothing and
   occupy zero space (position:fixed already keeps them out of layout flow). */
.drawer[hidden], .drawer-overlay[hidden] { display: none; }
@keyframes slideIn { from { transform: translateX(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 20px 22px; border-bottom: 1px solid var(--border); }
.drawer-head h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.drawer-close { border: none; background: var(--background); cursor: pointer; font-size: 15px;
  width: 32px; height: 32px; border-radius: 8px; color: var(--text-secondary); flex: none; }
.drawer-close:hover { background: var(--border); }
.drawer-body { padding: 18px 22px; overflow-y: auto; }
.detail-item { margin-bottom: 14px; }
.detail-item .di-label { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-secondary); margin-bottom: 3px; }
.detail-item .di-value { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.detail-item .di-value a { color: var(--primary); }

/* ---------- Loading ---------- */
.loading-overlay { position: fixed; inset: 0; background: var(--background); z-index: 80;
  display: flex; align-items: center; justify-content: center; }
.loading-inner { text-align: center; }
.loading-inner p { color: var(--text-secondary); margin: 14px 0 26px; }
.spinner { width: 38px; height: 38px; border: 3px solid var(--primary-light);
  border-top-color: var(--primary); border-radius: 50%; margin: 0 auto; animation: spin .8s linear infinite; }
.skeleton-row { display: flex; gap: 14px; justify-content: center; }
.skeleton-card { width: 150px; height: 90px; border-radius: var(--radius);
  background: linear-gradient(90deg, #eef2f0 25%, #e2e8e5 50%, #eef2f0 75%); background-size: 200% 100%;
  animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Footer ---------- */
.footer { display: flex; justify-content: space-between; padding: 18px 28px;
  color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--border); background: var(--surface); }

/* ---------- Presentation mode ---------- */
body.presentation .filter-bar,
body.presentation .footer { display: none !important; }
body.presentation .view { padding-top: 16px; }
body.presentation .chart-wrap { height: 300px; }
body.presentation .chart-wrap.tall { height: 440px; }
body.presentation #presentationBtn { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .charts-grid { grid-template-columns: 1fr; }
  .chart-card.wide { grid-column: auto; }
}
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; gap: 12px; padding: 10px 16px; }
  .topbar-actions { width: 100%; }
  .sync-label { margin-left: auto; }
  .pagehead, .view, .footer { padding-left: 16px; padding-right: 16px; }
  .kpi .kpi-value { font-size: 24px; }
}
</style>
